  description: >-
    Use the `/disputes` resource with a dispute ID and an action to:<ul><li>Accept a claim.</li><li>Accept
    an offer to resolve a dispute.</li><li>Acknowledge the return of an item related to a dispute.</li><li>Settle
    a dispute.</li><li>Appeal a dispute.</li><li>Cancel a dispute.</li><li>Change the reason for a dispute.</li><li>Deny
    an offer to resolve dispute.</li><li>Escalate a dispute to a claim.</li><li>Make an offer to resolve
    a dispute.</li><li>Make an offer to resolve a dispute.</li><li>Provide evidence for a dispute.</li><li>Provide
    supporting information for dispute.</li><li>In the sandbox, update the dispute status.</li><li>Send
    a message about a dispute to the other party in the dispute.</li><ul>
