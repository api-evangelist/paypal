description: >-
  PayPal's processor response-code taxonomy — the issuer/processor-level reasons
  a card authorization is approved or declined. Distinct from the API-level error
  codes (errors/paypal-problem-types.yml): these are the value of the
  processor_response.response_code field on a card payment source, and describe
  why the network/issuer accepted or rejected the authorization. Codes are numeric
  (ISO-8583-style, e.g. 5120) or PayPal-specific alphanumerics (PPxx). The same
  codes back the sandbox CCREJECT-* rejection triggers (sandbox/paypal-sandbox.yml).
docs:
  - https://developer.paypal.com/serversdk/php/models/enumerations/processor-response-code/
  - https://developer.paypal.com/api/rest/responses/
envelope_field: processor_response.response_code   # on card payment_source responses
also_on: errors/paypal-problem-types.yml (API-level name/message/details errors)
