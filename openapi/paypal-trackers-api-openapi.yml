          minItems: 0
          maxItems: 10000
          items:
            $ref: '#/components/schemas/error_link_description'
    orders.trackers.patch-400:
      properties:
        details:
          type: array
          items:
            anyOf:
            - title: FIELD_NOT_PATCHABLE
              properties:
                issue:
                  type: string
                  enum:
                  - FIELD_NOT_PATCHABLE
                description:
                  type: string
                  enum:
                  - Field cannot be patched.
            - title: INVALID_PARAMETER_VALUE
              properties:
                issue:
                  type: string
                  enum:
                  - INVALID_PARAMETER_VALUE
                description:
                  type: string
                  enum:
                  - The value of a field is invalid.
            - title: MISSING_REQUIRED_PARAMETER
              properties:
                issue:
                  type: string
                  enum:
                  - MISSING_REQUIRED_PARAMETER
                description:
                  type: string
                  enum:
                  - A required field or parameter is missing.
            - title: INVALID_STRING_LENGTH
              properties:
                issue:
                  type: string
                  enum:
                  - INVALID_STRING_LENGTH
                description:
                  type: string
                  enum:
                  - The value of a field is either too short or too long.
            - title: INVALID_PATCH_OPERATION
              properties:
                issue:
                  type: string
                  enum:
                  - INVALID_PATCH_OPERATION
                description:
                  type: string
                  enum:
                  - The operation cannot be honored. Cannot add a property that's already present, use replace. Cannot remove a property thats not present, use add. Cannot replace a property thats not present, use add.
            - title: MALFORMED_REQUEST_JSON
              properties:
                issue:
                  type: string
                  enum:
                  - MALFORMED_REQUEST_JSON
                description:
                  type: string
                  enum:
                  - The request JSON is not well formed.
    error_details-2:
      title: Error Details
      type: object
      description: The error details. Required for client-side `4XX` errors.
      properties:
        field:
          type: string
          description: The field that caused the error. If this field is in the body, set this value to the field's JSON pointer value. Required for client-side errors.
        value:
          type: string
          description: The value of the field that caused the error.
        location:
          type: string
          description: The location of the field that caused the error. Value is `body`, `path`, or `query`.
          default: body
        issue:
          type: string
          description: The unique, fine-grained application-level error code.
        description:
          type: string
          description: The human-readable description for an issue. The description can change over the lifetime of an API, so clients must not depend on this value.
      required:
      - issue
