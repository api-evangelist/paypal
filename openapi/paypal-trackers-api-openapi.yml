  parameters:
    account_id:
      name: account_id
      in: query
      description: Encrypted PayPal Account ID of the buyer or seller.
      required: false
      schema:
        type: string
        minLength: 13
        maxLength: 13
        pattern: ^[2-9A-HJ-NP-Z]{13}$
    tracking_number:
      name: tracking_number
      in: query
      description: Filters the tracking information that appears in the response by a tracking number.
      required: false
      schema:
        type: string
    tracker_id:
      name: tracker_id
      in: path
      description: The order tracking ID.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: ^[A-Z0-9]+$
    id_2:
      name: id
      in: path
      description: The ID of the tracker in the <code><var>transaction_id</var>-<var>tracking_number</var></code> format.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[a-zA-Z0-9-_]*$
    id:
      name: id
      in: path
      description: The ID of the order that the tracking information is associated with.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: ^[A-Z0-9]+$
    transaction_id:
      name: transaction_id
      in: query
      description: Filters the tracking information that appears in the response by a PayPal transaction ID.
      required: true
      schema:
        type: string
  requestBodies:
    tracker_collection:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/tracker_collection'
  responses:
    default:
      description: The default response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_default'
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 authentication
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth2/token
          scopes:
            https://uri.paypal.com/services/subscriptions: Manage plan & subscription
externalDocs:
  url: https://developer.paypal.com/docs/api/subscriptions/v1/
